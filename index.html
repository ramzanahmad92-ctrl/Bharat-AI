<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bharat AI - Super Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #131314; --surface: #1e1f20; --msg-user: #2b2c2f; --border: #333; --accent: #FF9933; --text: #E3E3E3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        html, body { height: 100dvh; width: 100vw; background-color: var(--bg); color: var(--text); overflow: hidden; }
        .app-layout { display: flex; width: 100%; height: 100%; position: relative; }

        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; position: absolute; height: 100%; left: 0; top: 0; }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .action-btn { background-color: var(--msg-user); border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; flex: 1; }
        .action-btn:hover { background-color: #38393d; }
        
        .history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .history-item:hover { background-color: var(--msg-user); color: #fff; }

        /* Main Container */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100dvh; width: 100vw; background-color: var(--bg); position: relative; }
        
        header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background-color: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
        .brand-title { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .model-selector { background-color: var(--surface); color: var(--text); border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; outline: none; cursor: pointer; }

        /* Chat Box */
        #chat-box { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
        .message-wrapper { display: flex; width: 100%; gap: 10px; flex-direction: column; }
        .message-wrapper.user { align-items: flex-end; }
        .message-wrapper.ai { align-items: flex-start; }
        .message { max-width: 88%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user-msg { background-color: var(--msg-user); color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: var(--surface); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); width: 100%; max-width: 90%; }
        
        /* Markdown Pro Styling */
        .ai-msg pre { background: #000; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid #444; }
        .ai-msg code { font-family: monospace; background: #333; padding: 2px 6px; border-radius: 4px; font-size: 14px; color: #FF9933; }
        .ai-msg p { margin-bottom: 10px; }
        .ai-msg p:last-child { margin-bottom: 0; }
        .ai-msg ul, .ai-msg ol { margin-left: 20px; margin-bottom: 10px; }
        .ai-msg strong { color: #fff; }
        
        .msg-actions { display: flex; gap: 10px; margin-top: 5px; margin-left: 10px; }
        .copy-btn { background: transparent; border: none; color: #888; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 4px; }
        .copy-btn:hover { color: #fff; }

        /* Fixed Bottom Input */
        .input-container { padding: 10px 15px; padding-bottom: max(15px, env(safe-area-inset-bottom)); background-color: var(--bg); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; border-top: 1px solid var(--border); z-index: 10; width: 100%; }
        
        #attachmentPreview { display: none; align-items: center; gap: 10px; background: var(--surface); padding: 6px 12px; border-radius: 8px; width: fit-content; border: 1px solid #444; font-size: 13px; color: var(--accent); }
        #attachmentPreview span { cursor: pointer; color: #ff5555; font-weight: bold; padding: 0 5px; }

        .input-box { width: 100%; max-width: 800px; margin: 0 auto; background-color: var(--surface); border: 1px solid #444; border-radius: 24px; display: flex; align-items: flex-end; padding: 8px 12px; gap: 8px; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); }
        .input-box:focus-within { border-color: var(--accent); }
        
        #user-input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 16px; outline: none; resize: none; max-height: 120px; overflow-y: auto; min-height: 24px; line-height: 1.4; }
        
        .icon-btn { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 20px; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .icon-btn:hover { background-color: var(--msg-user); color: #fff; }
        .send-btn { color: #138808; background-color: var(--msg-user); width: 40px; height: 40px; border-radius: 50%; margin-bottom: 2px; }
        .send-btn:hover { background-color: #138808; color: #fff; }
        
        .loading { font-style: italic; color: #888; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        @media(max-width: 768px) {
            .message { max-width: 92%; }
            .ai-msg { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" style="display:none; position:absolute; top:0; left:0; width:100vw; height:100dvh; background:rgba(0,0,0,0.6); z-index:999;" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <div class="sidebar closed" id="sidebar">
            <div class="sidebar-header" style="gap: 10px;">
                <button class="action-btn" onclick="startNewChat()">+ New Chat</button>
                <button class="action-btn" onclick="exportChat()" style="flex: 0 0 auto;" title="Download Chat">💾</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-item" style="color: #FF9933;">✨ Bharat AI Super Session</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-container">
            <header>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="icon-btn" onclick="toggleSidebar()" style="font-size: 20px;">☰</button>
                    <div class="brand-title">BHARAT AI</div>
                </div>
                <div>
                    <select class="model-selector" id="modelSelect">
                        <option value="ultra">Super Intelligence ⚡ (IQ 200+)</option>
                    </select>
                </div>
            </header>

            <div id="chat-box">
                <div class="message-wrapper ai">
                    <div class="message ai-msg">Namaste Director Sahab! Mera High-IQ Engine ab fully active hai. Ab main deep details aur perfect words ke sath high-end answers dunga. Test karke dekhiye!</div>
                </div>
            </div>

            <!-- Fixed Input Area -->
            <div class="input-container">
                <div id="attachmentPreview">
                    <span style="color:#FF9933" id="fileIconPreview">📄</span>
                    <b id="fileNameText">file.png</b>
                    <span onclick="clearAttachment()" title="Remove">✕</span>
                </div>

                <div class="input-box">
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(event)">

                    <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">📎</button>
                    <button class="icon-btn" onclick="document.getElementById('cameraInput').click()" title="Camera">📷</button>
                    <button class="icon-btn" id="micBtn" onclick="startVoiceRecognition()" title="Voice">🎙️</button>
                    
                    <textarea id="user-input" rows="1" placeholder="Message Bharat AI..." oninput="autoResize(this)"></textarea>
                    
                    <button class="icon-btn send-btn" onclick="sendMessage()" title="Send">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const attachmentPreview = document.getElementById('attachmentPreview');
        const fileNameText = document.getElementById('fileNameText');
        
        let isWaiting = false;
        let attachedFileData = null;
        
        // Context log structure
        let conversationLog = [];

        function toggleSidebar() {
            sidebar.classList.toggle('closed');
            overlay.style.display = sidebar.classList.contains('closed') ? 'none' : 'block';
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 120 ? textarea.scrollHeight : 120) + 'px';
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function startNewChat() {
            chatBox.innerHTML = `<div class="message-wrapper ai"><div class="message ai-msg">Nayi chat shuru ho chuki hai Director Sahab! Main ready hoon.</div></div>`;
            conversationLog = [];
            clearAttachment();
            if(!sidebar.classList.contains('closed')) toggleSidebar();
        }

        function copyText(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                button.innerHTML = "✅ Copied";
                setTimeout(() => button.innerHTML = "📋 Copy", 2000);
            });
        }

        function exportChat() {
            let chatText = conversationLog.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join("\n\n");
            const blob = new Blob([chatText], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Bharat_AI_Chat_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        }

        function appendMessage(text, sender, isHtml = false, rawTextForCopy = "") {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper');
            wrapper.classList.add(sender === 'user' ? 'user' : 'ai');

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
            
            if(isHtml) { 
                msgDiv.innerHTML = text; 
            } else if (sender === 'ai' && typeof marked !== 'undefined') {
                msgDiv.innerHTML = marked.parse(text);
            } else { 
                msgDiv.innerText = text; 
            }
            
            wrapper.appendChild(msgDiv);

            if (sender === 'ai' && rawTextForCopy !== "") {
                const actionsDiv = document.createElement('div');
                actionsDiv.classList.add('msg-actions');
                const safeText = rawTextForCopy.replace(/"/g, '&quot;').replace(/'/g, "\\'");
                actionsDiv.innerHTML = `<button class="copy-btn" onclick="copyText(this, '${safeText}')">📋 Copy</button>`;
                wrapper.appendChild(actionsDiv);
            }

            chatBox.appendChild(wrapper);
            scrollToBottom();
            return msgDiv;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFileData = { name: file.name, type: file.type, data: e.target.result };
                fileNameText.innerText = file.name;
                document.getElementById('fileIconPreview').innerText = file.type.startsWith('image/') ? '🖼️' : '📄';
                attachmentPreview.style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            attachedFileData = null;
            attachmentPreview.style.display = "none";
            document.getElementById('fileInput').value = "";
            document.getElementById('cameraInput').value = "";
        }

        // HIGH-IQ PROXY ENGINE (Forcing OpenAI/GPT-Level Routing)
        async function fetchWithUltraIQ(conversationArray) {
            let fullTranscript = conversationArray.map(c => `${c.sender === 'user' ? 'User' : 'Assistant'}: ${c.text}`).join("\n");
            
            // Ultra-Strict Brain Injection
            let smartPrompt = `System: You are Bharat AI, an elite, ultra-high IQ super-intelligence created exclusively by Iftikharuddin Ansari. 
Rules for you:
1. Always write highly articulate, deeply thought-out, and perfect text.
2. Reply strictly in natural, smart Hinglish (Indian Roman Hindi).
3. Do not give short, lazy, or low-effort answers. Think like a genius.
4. Format responses beautifully with bullet points, bold text, or code blocks if needed.

Conversation:
${fullTranscript}
Assistant:`;

            // Forcing backend to use top-tier models (openai/claude equivalents)
            const proxies = [
                `https://text.pollinations.ai/${encodeURIComponent(smartPrompt)}?model=openai`,
                `https://text.pollinations.ai/${encodeURIComponent(smartPrompt)}?model=claude`,
                `https://corsproxy.io/?https://text.pollinations.ai/${encodeURIComponent(smartPrompt)}`
            ];

            for (let attempt = 0; attempt < 3; attempt++) {
                for (let url of proxies) {
                    try {
                        const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
                        if (response.ok) {
                            let text = await response.text();
                            if (text && text.trim().length > 2 && !text.includes("busy")) {
                                return text.replace(/^Assistant:\s*/i, "").trim();
                            }
                        }
                    } catch (err) { continue; }
                }
                await new Promise(resolve => setTimeout(resolve, 800));
            }
            return "Maaf karna Director Sahab, network abhi thoda overload hai. Ek baar aur send karein!";
        }

        async function fetchLiveWeather(location) {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1`);
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) return null;
                const { latitude, longitude, name, country } = geoData.results[0];
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const weatherData = await weatherRes.json();
                if (weatherData.current_weather) {
                    const cw = weatherData.current_weather;
                    return `**${name}, ${country}** ka Live Mausam:\n- 🌡️ **Tapmaan:** ${cw.temperature}°C\n- 💨 **Hawa ki Gati:** ${cw.windspeed} km/h`;
                }
            } catch (e) { return null; }
            return null;
        }

        async function sendMessage() {
            if(isWaiting) return;
            let text = userInput.value.trim();
            if (text === '' && !attachedFileData) return;
            
            let displayHtml = "";
            let logText = "";

            if (attachedFileData) {
                if (attachedFileData.type.startsWith('image/')) {
                    displayHtml += `<img src="${attachedFileData.data}" style="width: 100%; border-radius: 8px; margin-bottom: 8px;" alt="Attached Image"><br>`;
                } else {
                    displayHtml += `📂 <b>[File: ${attachedFileData.name}]</b><br><br>`;
                }
                logText += `[User Attached File: ${attachedFileData.name}] `;
            }
            if (text !== "") {
                displayHtml += text;
                logText += text;
            }

            appendMessage(displayHtml, 'user', true);
            
            userInput.value = '';
            userInput.style.height = 'auto'; 
            clearAttachment();
            isWaiting = true;

            conversationLog.push({ sender: "user", text: logText });
            const lowerText = text.toLowerCase();

            // 1. STRICT FOUNDER OVERRIDE
            if (lowerText.includes("founder") || lowerText.includes("owner") || (lowerText.includes("kisne") && lowerText.includes("banaya")) || (lowerText.includes("kaun") && lowerText.includes("malik"))) {
                setTimeout(() => {
                    const reply = "Mujhe **Iftikharuddin Ansari** ne banaya hai, wahi mere Director aur Founder hain.";
                    appendMessage(reply, 'ai', false, reply);
                    conversationLog.push({ sender: "assistant", text: reply });
                    isWaiting = false;
                }, 400);
                return;
            }

            // 2. IMAGE GENERATION LOGIC
            if (lowerText.includes("photo") || lowerText.includes("image") || lowerText.includes("tasveer") || lowerText.includes("pic") || lowerText.includes("bana do")) {
                const loadingMsg = appendMessage("Bharat AI ultra-HD photo render kar raha hai... 🎨", 'ai');
                loadingMsg.classList.add('loading');
                setTimeout(() => {
                    const safePrompt = encodeURIComponent(text);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=1080&height=1080&nologo=true&enhance=true`;
                    chatBox.removeChild(loadingMsg.parentNode);
                    const imgReply = `<img src="${imageUrl}" style="width: 100%; border-radius: 12px; margin-top: 5px;" alt="AI Image" onload="scrollToBottom()"><br>Yeh lijiye aapki high-quality tasveer!`;
                    appendMessage(imgReply, 'ai', true, "Image generated successfully.");
                    conversationLog.push({ sender: "assistant", text: "[Generated Image successfully]" });
                    isWaiting = false;
                }, 1200);
                return;
            }

            // 3. LIVE WEATHER INTENT
            if (lowerText.includes("weather") || lowerText.includes("mausam") || lowerText.includes("temperature") || lowerText.includes("tapmaan")) {
                const loadingMsg = appendMessage("Live satellite data nikal rahe hain... 🛰️", 'ai');
                loadingMsg.classList.add('loading');
                
                let city = "Delhi";
                const words = text.split(" ");
                let foundCity = words[words.length - 1];
                if(foundCity && foundCity.length > 2 && !["weather", "mausam", "ka", "kaisa", "hai", "kya"].includes(foundCity.toLowerCase())) {
                    city = foundCity;
                }
                
                const weatherReport = await fetchLiveWeather(city);
                chatBox.removeChild(loadingMsg.parentNode);
                
                const finalWeatherMsg = weatherReport || "Mausam ki jankari mil nahi saki, kripya city ka sahi naam likhein.";
                appendMessage(finalWeatherMsg, 'ai', false, finalWeatherMsg);
                conversationLog.push({ sender: "assistant", text: finalWeatherMsg });
                isWaiting = false;
                return;
            }

            // 4. ULTRA-IQ CHAT ENGINE
            const loadingMsg = appendMessage("Soch rahe hain... 🧠", 'ai');
            loadingMsg.classList.add('loading');

            try {
                let replyText = await fetchWithUltraIQ(conversationLog);
                chatBox.removeChild(loadingMsg.parentNode);
                
                if (lowerText.includes("founder") || lowerText.includes("owner")) {
                    replyText = "Mujhe **Iftikharuddin Ansari** ne banaya hai, wahi mere Director aur Founder hain.";
                }

                if(replyText && replyText.trim() !== "") {
                    appendMessage(replyText, 'ai', false, replyText);
                    conversationLog.push({ sender: "assistant", text: replyText });
                } else {
                    appendMessage("Response generate karne me dikkat aayi Director Sahab.", 'ai', false, "Error");
                }
            } catch (error) {
                chatBox.removeChild(loadingMsg.parentNode);
                appendMessage("Network issue, ek baar aur try karein!", 'ai', false, "Connection error");
            }
            isWaiting = false;
        }

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault(); 
                sendMessage(); 
            }
        });

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Aapka browser voice input support nahi karta."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            const micBtn = document.getElementById('micBtn');
            micBtn.style.color = "#FF9933";
            recognition.onresult = function(event) {
                userInput.value += event.results[0][0].transcript;
                autoResize(userInput);
                micBtn.style.color = "#aaa";
            };
            recognition.onerror = function() { micBtn.style.color = "#aaa"; }
            recognition.onend = function() { micBtn.style.color = "#aaa"; }
            recognition.start();
        }
    </script>
</body>
</html>
