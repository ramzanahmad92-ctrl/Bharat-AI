<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat AI - The Super Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: #131314; color: #E3E3E3; display: flex; flex-direction: column; height: 100vh; }
        
        /* Premium Tiranga Gradient Header */
        header { 
            padding: 20px; 
            text-align: center; 
            background-color: #1E1F20; 
            border-bottom: 1px solid #333; 
            font-size: 26px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }
        
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 16px; word-wrap: break-word; }
        .user-msg { background-color: #2a2b2e; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: #1E1F20; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
        
        .input-area { display: flex; padding: 15px; background-color: #1E1F20; gap: 10px; align-items: center; border-top: 1px solid #333;}
        #user-input { flex: 1; background-color: #2a2b2e; border: 1px solid #444; color: white; padding: 15px 20px; border-radius: 25px; font-size: 16px; outline: none; transition: 0.3s; }
        #user-input:focus { border-color: #FF9933; }
        
        .btn { background-color: #2a2b2e; border: none; color: white; padding: 15px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; width: 52px; height: 52px; transition: 0.3s; }
        .btn:hover { background-color: #3a3b3e; transform: scale(1.05); }
        .mic-btn { color: #FF9933; } 
        .send-btn { color: #138808; } 
        .loading { font-style: italic; color: #888; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>✨ BHARAT AI</header>

    <div id="chat-box">
        <div class="message ai-msg">Namaste Director Sahab! Main Bharat AI hoon, ek Super Intelligence model. Aap mujhse koi bhi sawal pooch sakte hain ya "photo banao" bol kar high-quality image generate karwa sakte hain.</div>
    </div>

    <div class="input-area">
        <button class="btn mic-btn" id="micBtn" onclick="startVoiceRecognition()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type here or ask for a photo...">
        <button class="btn send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        // Aapki Gemini API Key (Pro Version)
        const API_KEY = 'AQ.Ab8RN6IZ97zgh-EKGIinXuiZ9xUmrOUvV_NO0xqA7SsS68ltcg'; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        let isWaiting = false;

        function appendMessage(text, sender, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
            
            if(isHtml) { 
                // Format basic Markdown to HTML
                let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                                        .replace(/\*(.*?)\*/g, '<i>$1</i>')
                                        .replace(/\n/g, '<br>');
                msgDiv.innerHTML = formattedText; 
            } else { 
                msgDiv.innerText = text; 
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            if(isWaiting) return;
            const text = userInput.value.trim();
            if (text === '') return;
            
            appendMessage(text, 'user');
            userInput.value = '';
            isWaiting = true;

            // 1. IMAGE GENERATION LOGIC
            const lowerText = text.toLowerCase();
            if (lowerText.includes("photo") || lowerText.includes("image") || lowerText.includes("tasveer") || lowerText.includes("pic")) {
                const loadingMsg = appendMessage("Bharat AI aapki photo bana raha hai, kripya wait karein... 🎨", 'ai');
                loadingMsg.classList.add('loading');
                
                setTimeout(() => {
                    const safePrompt = encodeURIComponent(text);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=1024&height=1024&nologo=true`;
                    chatBox.removeChild(loadingMsg);
                    appendMessage(`<img src="${imageUrl}" style="width: 100%; border-radius: 8px; margin-top: 5px;" alt="AI Generated Image"><br>Yeh lijiye aapki photo! Ise save karne ke liye photo par long-press karein.`, 'ai', true);
                    isWaiting = false;
                }, 2000);
                return;
            }

            // 2. TEXT GENERATION LOGIC (GEMINI PRO)
            const loadingMsg = appendMessage("Bharat AI soch raha hai...", 'ai');
            loadingMsg.classList.add('loading');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });
                
                const data = await response.json();
                chatBox.removeChild(loadingMsg);
                
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage(data.candidates[0].content.parts[0].text, 'ai', true);
                } else {
                    appendMessage("Server par load zyada hai, kripya dobara koshish karein.", 'ai');
                }
            } catch (error) {
                chatBox.removeChild(loadingMsg);
                appendMessage("API connection fail ho gaya. Internet check karein.", 'ai');
            }
            isWaiting = false;
        }

        // Enter key to send message
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
        });

        // VOICE COMMAND LOGIC (WEB SPEECH API)
        function startVoiceRecognition() {
            const micBtn = document.getElementById('micBtn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Aapka browser voice support nahi karta. Kripya Google Chrome use karein.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // Indian context and Hindi support
            recognition.interimResults = false;

            recognition.onstart = function() {
                micBtn.style.backgroundColor = '#FF9933'; // Mic turns saffron when listening
                micBtn.style.color = 'white';
            };

            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                sendMessage(); 
            };

            recognition.onend = function() {
                micBtn.style.backgroundColor = '#2a2b2e';
                micBtn.style.color = '#FF9933';
            };

            recognition.start();
        }
    </script>
</body>
</html>
