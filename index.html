<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat AI - The Super Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: #131314; color: #E3E3E3; display: flex; flex-direction: column; height: 100vh; }
        
        header { 
            padding: 20px; 
            text-align: center; 
            background-color: #1E1F20; 
            border-bottom: 1px solid #333; 
            font-size: 26px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }
        
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 16px; word-wrap: break-word; }
        .user-msg { background-color: #2a2b2e; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: #1E1F20; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
        
        .input-area { display: flex; padding: 15px; background-color: #1E1F20; gap: 10px; align-items: center; border-top: 1px solid #333;}
        #user-input { flex: 1; background-color: #2a2b2e; border: 1px solid #444; color: white; padding: 15px 20px; border-radius: 25px; font-size: 16px; outline: none; transition: 0.3s; }
        #user-input:focus { border-color: #FF9933; }
        
        .btn { background-color: #2a2b2e; border: none; color: white; padding: 15px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; width: 52px; height: 52px; transition: 0.3s; }
        .btn:hover { background-color: #3a3b3e; transform: scale(1.05); }
        .mic-btn { color: #FF9933; } 
        .send-btn { color: #138808; } 
        .loading { font-style: italic; color: #888; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>✨ BHARAT AI</header>

    <div id="chat-box">
        <div class="message ai-msg">Namaste Director Sahab! Main Bharat AI hoon. Ab yeh bilkul fast aur makkhan ki tarah chalegi. Kuch bhi puchiye!</div>
    </div>

    <div class="input-area">
        <button class="btn mic-btn" id="micBtn" onclick="startVoiceRecognition()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type here or ask for a photo...">
        <button class="btn send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        let isWaiting = false;

        function appendMessage(text, sender, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
            
            if(isHtml) { 
                let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                                        .replace(/\*(.*?)\*/g, '<i>$1</i>')
                                        .replace(/\n/g, '<br>');
                msgDiv.innerHTML = formattedText; 
            } else { 
                msgDiv.innerText = text; 
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            if(isWaiting) return;
            const text = userInput.value.trim();
            if (text === '') return;
            
            appendMessage(text, 'user');
            userInput.value = '';
            isWaiting = true;

            const lowerText = text.toLowerCase();
            if (lowerText.includes("photo") || lowerText.includes("image") || lowerText.includes("tasveer") || lowerText.includes("pic")) {
                const loadingMsg = appendMessage("Bharat AI photo bana raha hai... 🎨", 'ai');
                loadingMsg.classList.add('loading');
                
                setTimeout(() => {
                    const safePrompt = encodeURIComponent(text);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=1024&height=1024&nologo=true`;
                    chatBox.removeChild(loadingMsg);
                    appendMessage(`<img src="${imageUrl}" style="width: 100%; border-radius: 8px; margin-top: 5px;" alt="AI Generated Image"><br>Yeh lijiye aapki photo!`, 'ai', true);
                    isWaiting = false;
                }, 1500);
                return;
            }

            const loadingMsg = appendMessage("Bharat AI soch raha hai...", 'ai');
            loadingMsg.classList.add('loading');

            try {
                // Using DuckDuckGo AI chat proxy - super fast, free, no API key needed
                const response = await fetch('https://duckduckgo.com/duckchat/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{ role: 'user', content: text }]
                    })
                });

                if (!response.ok) {
                    throw new Error("Proxy limit");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";

                chatBox.removeChild(loadingMsg);
                const aiMsgDiv = appendMessage("", 'ai', true);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    let chunk = decoder.decode(value, { stream: true });
                    
                    let lines = chunk.split('\n');
                    for (let line of lines) {
                        if (line.startsWith('data: ')) {
                            let jsonStr = line.replace('data: ', '').trim();
                            if (jsonStr === '[DONE]') continue;
                            try {
                                let parsed = JSON.parse(jsonStr);
                                if (parsed.message) {
                                    fullResponse += parsed.message;
                                    aiMsgDiv.innerHTML = fullResponse.replace(/\n/g, '<br>');
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (!fullResponse) {
                    aiMsgDiv.innerText = "Namaste! Bharat AI tayar hai. Kripya dobara puchiye.";
                }

            } catch (error) {
                // Fallback to instant text proxy if needed
                try {
                    const fallbackRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                    const fallbackText = await fallbackRes.text();
                    chatBox.removeChild(loadingMsg);
                    appendMessage(fallbackText, 'ai', true);
                } catch (err) {
                    chatBox.removeChild(loadingMsg);
                    appendMessage("Network busy hai, ek baar phir try karein.", 'ai');
                }
            }
            isWaiting = false;
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
        });

        function startVoiceRecognition() {
            const micBtn = document.getElementById('micBtn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Voice recognition not supported."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                sendMessage(); 
            };
            recognition.start();
        }
    </script>
</body>
</html>
